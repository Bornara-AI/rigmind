services:
  db:
    image: pgvector/pgvector:pg16
    env_file: .env
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  django:
    build: ./backend_django
    env_file: .env
    environment:
      PETRINEX_RAW_DIR: /data/raw/petrinex
    command: python manage.py runserver 0.0.0.0:8000
    ports:
      - "8000:8000"
    volumes:
      - ./backend_django:/app # live reload while developing
      - ./data:/data # downloaded public data (data/raw is git-ignored)
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  ai:
    build: ./ai_service
    env_file: .env
    command: uvicorn app.main:app --host 0.0.0.0 --port 8001 --reload
    ports:
      - "8001:8001"
    volumes:
      - ./ai_service:/app
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
